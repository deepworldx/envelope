<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Absen Harian Princess 💌</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    // ID dari EmailJS
    const SERVICE_ID = "service_ti29gts";
    const TEMPLATE_ID = "template_48qiouv";
    const PUBLIC_KEY = "rFoCQfEWoG7OucXfI";
    (function(){ emailjs.init(PUBLIC_KEY); })();
  </script>

  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f4f7ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 340px;
      text-align: center;
    }
    input, select, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #005fe6; }
    .preview img { width: 100%; margin-top: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Absen Harian Princess 👑</h2>

    <label>Mood Hari Ini:</label>
    <select id="mood">
      <option value="">Pilih...</option>
      <option>Bahagia</option>
      <option>Capek</option>
      <option>Ngantuk</option>
      <option>Tenang</option>
      <option>Stres</option>
    </select>

    <label>Makan Apa Hari Ini?</label>
    <textarea id="makan" rows="2" placeholder="Contoh: Nasi goreng + teh manis"></textarea>

    <label>Absen Foto 📸</label>
    <input type="file" id="foto" accept="image/*">
    <div id="preview" class="preview"></div>

    <button onclick="kirimAbsen()">Kirim Absen 💌</button>
  </div>

  <script>
    let base64Foto = "";

    document.getElementById("foto").addEventListener("change", function() {
      const file = this.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        alert("⚠️ Foto terlalu besar! Maksimal 3MB ya.");
        return;
      }

      const reader = new FileReader();
      reader.onloadend = function() {
        base64Foto = reader.result;
        document.getElementById("preview").innerHTML =
          `<img src="${reader.result}" alt="preview"><br>
           <button onclick="hapusFoto()" style="margin-top:8px;background:#ccc;color:#000;">Hapus Foto</button>`;
      };
      reader.readAsDataURL(file);
    });

    function hapusFoto() {
      base64Foto = "";
      document.getElementById("foto").value = "";
      document.getElementById("preview").innerHTML = "";
    }

    async function kirimAbsen() {
      const mood = document.getElementById("mood").value;
      const makan = document.getElementById("makan").value;

      if (!mood || !makan) {
        alert("⚠️ Isi semua kolom dulu ya (mood & makan).");
        return;
      }

      const params = { mood, makan, foto: base64Foto };

      try {
        const response = await emailjs.send(SERVICE_ID, TEMPLATE_ID, params);
        alert("✅ Absen berhasil dikirim! Cek email kamu 💌");
        hapusFoto();
        document.getElementById("mood").value = "";
        document.getElementById("makan").value = "";
      } catch (err) {
        // Tampilkan popup error detail
        let detail = "Terjadi kesalahan saat mengirim 😢";
        if (err.status === 401) detail = "❌ 401 Unauthorized:\nPublic key salah atau belum diaktifkan di EmailJS.";
        else if (err.status === 404) detail = "❌ 404 Not Found:\nService ID atau Template ID tidak ditemukan.";
        else if (err.status === 429) detail = "⚠️ 429 Quota Habis:\nKamu sudah mencapai batas pengiriman EmailJS gratis.";
        else if (err.text?.includes("Missing")) detail = "⚠️ Variabel Template tidak cocok.\nPastikan di EmailJS ada {{mood}}, {{makan}}, {{foto}}.";
        else if (err.text) detail = `⚠️ ${err.text}`;
        else if (typeof err === "object") detail += "\n\n" + JSON.stringify(err, null, 2);

        alert(detail);
        console.error("Detail error:", err);
      }
    }
  </script>
</body>
</html>
